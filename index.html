<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锦宝专属奶粉信息查询库</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: "Microsoft YaHei", sans-serif}
        body{background:#f5f7fa;padding:20px}
        .container{max-width:900px;margin:0 auto}
        .title{text-align:center;margin:20px 0;color:#2c8dfb;font-size:24px}
        .subtitle{text-align:center;color:#666;margin-bottom:30px;font-size:16px}
        .search-box{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}
        #kw{flex:1;height:44px;padding:0 15px;border:1px solid #ddd;border-radius:8px;font-size:16px}
        #searchBtn{padding:0 20px;background:#2c8dfb;color:white;border:0;border-radius:8px;cursor:pointer}
        .filter-box{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
        .filter-box select{height:40px;padding:0 10px;border:1px solid #ddd;border-radius:8px}
        .item{background:white;padding:15px;margin-bottom:10px;border-radius:10px;box-shadow:0 2px 5px #00000010}
        .item h3{color:#333;margin-bottom:5px}
        .item p{color:#666;font-size:14px;line-height:1.5}
        .tip{color:#999;text-align:center;margin-top:30px}
        .hide{display:none}
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">锦宝专属奶粉信息查询库</h1>
        <p class="subtitle">愿天下宝宝健康成长</p>

        <div class="search-box">
            <input id="kw" placeholder="输入品牌/名称/段位，如：飞鹤、1段、羊奶粉">
            <button id="searchBtn">立即查询</button>
        </div>

        <div class="filter-box">
            <select id="typeFilter">
                <option value="">全部类型</option>
                <option value="牛奶粉">牛奶粉</option>
                <option value="羊奶粉">羊奶粉</option>
                <option value="水解奶粉">水解奶粉</option>
            </select>

            <select id="stageFilter">
                <option value="">全部段位</option>
                <option value="1段">1段（0-6个月）</option>
                <option value="2段">2段（6-12个月）</option>
                <option value="3段">3段（12-36个月）</option>
            </select>
        </div>

        <div id="result" class="hide"></div>
    </div>

    <script>
        const DATA_URL = "https://raw.githubusercontent.com/cqhwh-commits/milk-data/refs/heads/main/milk.json";
        let milkData = [];

        fetch(DATA_URL)
            .then(res => res.json())
            .then(data => {
                milkData = data;
            });

        document.getElementById("searchBtn").onclick = function(){
            const kw = document.getElementById("kw").value.trim();
            const type = document.getElementById("typeFilter").value;
            const stage = document.getElementById("stageFilter").value;
            
            if(!kw){
                alert("请输入关键词");
                return;
            }

            let list = milkData.filter(item => 
                (item.brand.includes(kw) || item.name.includes(kw) || item.stage.includes(kw)) &&
                (type == "" || item.type == type) &&
                (stage == "" || item.stage == stage)
            );

            let sameLevelList = [];
            if(list.length > 0){
                let first = list[0];
                sameLevelList = milkData.filter(item => 
                    item.stage == first.stage && 
                    item.type == first.type && 
                    item != first
                ).slice(0, 5);
            }

            showResult(list, sameLevelList);
            document.getElementById("result").classList.remove("hide");
        }

        function showResult(list, sameLevelList){
            let html = "";

            if(list.length > 0){
                html += "<h3 style='margin:20px 0 10px'>🔍 查询结果</h3>";
                list.forEach(item => {
                    html += `
                    <div class="item">
                        <h3>${item.brand} ${item.name}</h3>
                        <p>版本：${item.version} | 国标：${item.standard} | 段位：${item.stage}</p>
                        <p>价格：${item.price}元 | 类型：${item.type} | 适合：${item.fit}</p>
                        <p>配方：${item.formula}</p>
                    </div>
                    `;
                });

                if(sameLevelList.length > 0){
                    html += "<h3 style='margin:30px 0 10px;color:#ff5722'>⭐ 同等级推荐奶粉</h3>";
                    sameLevelList.forEach(item => {
                        html += `
                        <div class="item">
                            <h3>${item.brand} ${item.name}</h3>
                            <p>段位：${item.stage} | 类型：${item.type} | 价格：${item.price}元</p>
                        </div>
                        `;
                    });
                }
            }else{
                html = "<p style='text-align:center;padding:20px'>未找到相关奶粉</p>";
            }

            document.getElementById("result").innerHTML = html;
        }
    </script>
</body>
</html>
